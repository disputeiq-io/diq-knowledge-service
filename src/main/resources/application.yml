spring:
  application:
    name: diq-knowledge-service
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/knowledge_db}
    username: ${SPRING_DATASOURCE_USERNAME:diq_app}
    password: ${SPRING_DATASOURCE_PASSWORD:diq_app_local_dev}
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/migration-postgresql

server:
  port: 8084
  shutdown: graceful

management:
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

diq:
  service:
    environment: local
